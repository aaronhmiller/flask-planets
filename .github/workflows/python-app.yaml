# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.9
      uses: actions/setup-python@v2
      with:
        python-version: 3.9
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask
    - name: Run and test app on port 5001
      run: |
        FLASK_APP=app.py python -m flask run --port 5001 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:5001/planets |
          python -c 'import json, sys; planets = json.load(sys.stdin); assert len(planets) == 8 and planets[2]["name"] == "Earth"'
        curl --fail --silent --show-error http://127.0.0.1:5001/planets/3 |
          python -c 'import json, sys; planet = json.load(sys.stdin); assert planet["name"] == "Earth" and planet["position"] == 3'
